name: Compilar plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar con Maven
        run: mvn -B -ntp package

      # Temporal: muestra la API de GameRule y ParticleBuilder de Paper 26.3 para migrar lo obsoleto.
      - name: Consultar API (temporal)
        run: |
          mvn -B -ntp -q dependency:get -Dtransitive=false \
            -Dartifact=io.papermc.paper:paper-api:26.3.build.140-beta:jar:sources \
            -DremoteRepositories=papermc::default::https://repo.papermc.io/repository/maven-public/
          F=$(find ~/.m2 -name 'paper-api-26.3*-sources.jar' | head -1)
          mkdir -p /tmp/api && cd /tmp/api && unzip -q -o "$F" 'org/bukkit/GameRule*.java' 'org/bukkit/GameRules*.java' \
            'com/destroystokyo/paper/ParticleBuilder.java' 'io/papermc/paper/world/*' 2>/dev/null || true
          find /tmp/api -name '*.java' | sort
          for f in $(find /tmp/api -name 'GameRule*.java'); do echo "===== $f"; grep -n "public static final\|@Deprecated\|@deprecated\|forRemoval\|getByName\|getKey\|class \|interface " "$f" | head -400; done
          echo "===== ParticleBuilder"; grep -n -B6 "public ParticleBuilder extra\|public ParticleBuilder speed\|public ParticleBuilder offset(" /tmp/api/com/destroystokyo/paper/ParticleBuilder.java | head -80

      - name: Validar y empaquetar el paquete de recursos
        run: python3 herramientas/armar_paquete.py

      # Plugin compilado + paquete de recursos + scripts del server, listo para copiar a la VM.
      - name: Armar paquete
        run: |
          mkdir -p paquete
          cp target/TresModos.jar target/tresmodos-pack.zip instalar.sh mc apagado-inactivo.sh paquete/

      - uses: actions/upload-artifact@v4
        with:
          name: tresmodos
          path: paquete/

      # El plugin baja el paquete de recursos desde este release y se lo manda a los jugadores.
      - name: Publicar paquete de recursos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pack >/dev/null 2>&1 || gh release create pack --target "$GITHUB_SHA" --prerelease \
            --title "Paquete de recursos" \
            --notes "Paquete de recursos del server. Lo actualiza GitHub Actions en cada push a main."
          gh release upload pack target/tresmodos-pack.zip --clobber

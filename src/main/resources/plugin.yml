name: TresModos
version: '${project.version}'
main: ar.tresmodos.TresModos
api-version: '${api.version}'
description: Lobby con tres modos de juego (Guerra, Shooter y RPG/Souls)
commands:
  modo:
    description: Abre el selector de modos o cambia directo
    usage: /modo [guerra|shooter|rpg|lobby]
  lobby:
    description: Volver al lobby
    aliases: [hub, l]
  clase:
    description: Elegir clase (Guerra, Shooter o RPG)
  armero:
    description: Poner y sacar accesorios al arma de la mano
    aliases: [accesorios]
  tm:
    description: Comandos de administracion de TresModos
    usage: /tm <almas|jefe|cazador|guardar|paquete|info> ...
    permission: tresmodos.admin
permissions:
  tresmodos.admin:
    description: Acceso a /tm y a construir en los mundos de modo
    default: op
